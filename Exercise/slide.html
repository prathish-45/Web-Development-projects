<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Only Carousel</title>
<style>
/* 🎡 Carousel container */
.carousel {
  position: relative;
  width: 400px;
  height: 250px;
  overflow: hidden;
  border-radius: 12px;
  margin: 40px auto;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* 🖼️ Slides wrapper */
.slides {
  display: flex;
  width: 400%;
  height: 100%;
  transition: transform 0.6s ease-in-out;
}

/* 🧩 Each slide */
.slide {
  width: 100%;
  flex-shrink: 0;
}
.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 🧭 Hide radio inputs */
input[type="radio"] {
  display: none;
}

/* 📍 Navigation buttons (previous/next dots) */
.nav-dots {
  position: absolute;
  bottom: 15px;
  left: 50%;
  display: flex;
  transform: translateX(-50%);
  gap: 10px;
}
.nav-dots label {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #bbb;
  cursor: pointer;
  transition: 0.3s;
}
input#r1:checked ~ .nav-dots label[for="r1"],
input#r2:checked ~ .nav-dots label[for="r2"],
input#r3:checked ~ .nav-dots label[for="r3"],
input#r4:checked ~ .nav-dots label[for="r4"] {
  background: #333;
}

/* 🌀 Slide transitions */
#r1:checked ~ .slides { transform: translateX(0%); }
#r2:checked ~ .slides { transform: translateX(-100%); }
#r3:checked ~ .slides { transform: translateX(-200%); }
#r4:checked ~ .slides { transform: translateX(-300%); }

</style>
</head>
<body>

<div class="carousel">
  <!-- 🕹️ Radio buttons for slides -->
  <input type="radio" name="r" id="r1" checked>
  <input type="radio" name="r" id="r2">
  <input type="radio" name="r" id="r3">
  <input type="radio" name="r" id="r4">

  <!-- 🖼️ Image slides -->
  <div class="slides">
    <div class="slide"><img src="https://picsum.photos/id/1018/400/250" alt=""></div>
    <div class="slide"><img src="https://picsum.photos/id/1015/400/250" alt=""></div>
    <div class="slide"><img src="https://picsum.photos/id/1016/400/250" alt=""></div>
    <div class="slide"><img src="https://picsum.photos/id/1025/400/250" alt=""></div>
  </div>

  <!-- 🔘 Dots for navigation -->
  <div class="nav-dots">
    <label for="r1"></label>
    <label for="r2"></label>
    <label for="r3"></label>
    <label for="r4"></label>
  </div>
</div>

</body>
</html>
